<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Validation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <a href="validation.html">Registration Form</a> | 
        <a href="data.html">Data Table</a>
    </nav>

    <div class="container">
        <h2>Register</h2>
        <form id="regForm" novalidate>
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Enter your name">
                <span class="error-msg" id="nameError"></span>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email">
                <span class="error-msg" id="emailError"></span>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="At least 8 characters">
                <span class="error-msg" id="passError"></span>
            </div>

            <div class="form-group">
                <label for="confirmPass">Confirm Password</label>
                <input type="password" id="confirmPass" placeholder="Re-enter password">
                <span class="error-msg" id="confirmError"></span>
            </div>

            <div class="form-group">
                <label for="age">Age</label>
                <input type="number" id="age" placeholder="Enter your age">
                <span class="error-msg" id="ageError"></span>
            </div>

            <button type="submit" class="submit-btn">Submit</button>
        </form>
    </div>

    <!-- ربط ملف الـ JS الخارجي -->
    <script src="validation.js"></script>
</body>
</html>
